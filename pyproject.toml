[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-talk"
version = "0.3.2"
description = "Voice conversation plugin for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "sounddevice",
    "numpy",
    "mlx-audio[tts]",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
claude-talk = "claude_talk.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
